name: Refresh public sitemap mirror

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-sitemap
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Fetch and validate canonical public URLs
        shell: python
        run: |
          import pathlib
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET

          ORIGIN = "https://akademy.neodev.click"
          INDEX_URL = f"{ORIGIN}/sitemap-index.xml"
          USER_AGENT = "Mozilla/5.0 (compatible; NeopolisSitemapMirror/1.0; +https://akademy.neodev.click/)"
          PRIVATE_PREFIXES = (
              "/admin", "/api", "/training", "/mock-exam", "/account",
              "/settings", "/login", "/demo-login", "/accept-invitation",
              "/forgot-password", "/reset-password", "/apply", "/diagnostic",
          )
          NS = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}

          def fetch(url: str) -> bytes:
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": "application/xml,text/xml;q=0.9,*/*;q=0.1",
                      "Accept-Encoding": "identity",
                  },
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{url} returned HTTP {response.status}")
                  return response.read()

          index = ET.fromstring(fetch(INDEX_URL))
          sitemap_urls = [node.text.strip() for node in index.findall("sm:sitemap/sm:loc", NS) if node.text]
          if not sitemap_urls:
              raise RuntimeError("The source sitemap index contains no child sitemap")

          urls: list[str] = []
          for sitemap_url in sitemap_urls:
              if not sitemap_url.startswith(f"{ORIGIN}/sitemaps/"):
                  raise RuntimeError(f"Unexpected child sitemap: {sitemap_url}")
              root = ET.fromstring(fetch(sitemap_url))
              urls.extend(node.text.strip() for node in root.findall("sm:url/sm:loc", NS) if node.text)

          if len(urls) < 100 or len(urls) > 50_000:
              raise RuntimeError(f"Unexpected URL count: {len(urls)}")
          if len(urls) != len(set(urls)):
              raise RuntimeError("Duplicate canonical URLs detected")

          for url in urls:
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme != "https" or parsed.netloc != "akademy.neodev.click":
                  raise RuntimeError(f"Non-canonical URL: {url}")
              if parsed.query or parsed.fragment:
                  raise RuntimeError(f"URL with query or fragment: {url}")
              if any(parsed.path == prefix or parsed.path.startswith(f"{prefix}/") for prefix in PRIVATE_PREFIXES):
                  raise RuntimeError(f"Private URL in sitemap: {url}")

          pathlib.Path("sitemap.txt").write_text("\n".join(urls) + "\n", encoding="utf-8")
          print(f"Validated {len(urls)} unique canonical URLs from {len(sitemap_urls)} sitemap files")

      - name: Commit an updated mirror
        run: |
          if git diff --quiet -- sitemap.txt; then
            echo "The mirror is already current."
            exit 0
          fi
          git config user.name "Neopolis Sitemap Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.txt
          git commit -m "Refresh public sitemap"
          git push
