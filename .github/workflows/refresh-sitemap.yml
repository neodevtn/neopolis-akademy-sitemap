name: Refresh public sitemap mirror

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-public-sitemap
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Fetch and validate canonical public URLs
        shell: python
        run: |
          import datetime
          import hashlib
          import json
          import pathlib
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          ORIGIN = "https://akademy.neodev.click"
          INDEX_URL = f"{ORIGIN}/sitemap-index.xml"
          USER_AGENT = "Mozilla/5.0 (compatible; NeopolisSitemapMirror/1.0; +https://akademy.neodev.click/)"
          NS = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}

          PUBLIC_EXACT_PATHS = {
              "/",
              "/en",
              "/ar",
              "/ai-news",
              "/refer",
              "/mentions-legales",
              "/formations-ia",
              "/formations-ia/catalogue",
              "/formations-ia/golden-jobs",
              "/en/ai-training",
              "/en/ai-training/catalogue",
              "/en/ai-training/golden-jobs",
              "/ar/ai-training",
              "/ar/ai-training/catalogue",
              "/ar/ai-training/golden-jobs",
          }
          PUBLIC_DOMAIN_SLUGS = {
              "comptabilite-finance",
              "informatique-developpement",
              "data-bi-recherche",
              "administratif-ressources-humaines",
              "commerce-marketing-relation-client",
              "juridique-conformite",
              "strategie-transformation-ia",
          }
          PUBLIC_PREFIXES = (
              "/formations-ia/catalogue/",
              "/formations-ia/golden-jobs/",
              "/en/ai-training/catalogue/",
              "/en/ai-training/golden-jobs/",
              "/ar/ai-training/catalogue/",
              "/ar/ai-training/golden-jobs/",
          )

          def is_public_path(path: str) -> bool:
              if path in PUBLIC_EXACT_PATHS:
                  return True
              if path.startswith(PUBLIC_PREFIXES):
                  return True
              for base in ("/formations-ia/", "/en/ai-training/", "/ar/ai-training/"):
                  if path.startswith(base) and path.removeprefix(base) in PUBLIC_DOMAIN_SLUGS:
                      return True
              return False

          def fetch(url: str, attempts: int = 4) -> bytes:
              last_error = None
              for attempt in range(1, attempts + 1):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": USER_AGENT,
                              "Accept": "application/xml,text/xml;q=0.9,*/*;q=0.1",
                              "Accept-Encoding": "identity",
                          },
                      )
                      with urllib.request.urlopen(request, timeout=45) as response:
                          if response.status != 200:
                              raise RuntimeError(f"{url} returned HTTP {response.status}")
                          return response.read()
                  except (OSError, RuntimeError, urllib.error.URLError) as error:
                      last_error = error
                      if attempt == attempts:
                          break
                      delay = 2 ** (attempt - 1)
                      print(f"Attempt {attempt}/{attempts} failed for {url}: {error}; retrying in {delay}s")
                      time.sleep(delay)
              raise RuntimeError(f"Unable to fetch {url} after {attempts} attempts: {last_error}")

          index = ET.fromstring(fetch(INDEX_URL))
          sitemap_urls = [node.text.strip() for node in index.findall("sm:sitemap/sm:loc", NS) if node.text]
          if not sitemap_urls:
              raise RuntimeError("The source sitemap index contains no child sitemap")

          urls: list[str] = []
          for sitemap_url in sitemap_urls:
              if not sitemap_url.startswith(f"{ORIGIN}/sitemaps/"):
                  raise RuntimeError(f"Unexpected child sitemap: {sitemap_url}")
              root = ET.fromstring(fetch(sitemap_url))
              urls.extend(node.text.strip() for node in root.findall("sm:url/sm:loc", NS) if node.text)

          if len(urls) < 100 or len(urls) > 50_000:
              raise RuntimeError(f"Unexpected URL count: {len(urls)}")
          if len(urls) != len(set(urls)):
              raise RuntimeError("Duplicate canonical URLs detected")

          for url in urls:
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme != "https" or parsed.netloc != "akademy.neodev.click":
                  raise RuntimeError(f"Non-canonical URL: {url}")
              if parsed.query or parsed.fragment:
                  raise RuntimeError(f"URL with query or fragment: {url}")
              if not is_public_path(parsed.path):
                  raise RuntimeError(f"URL outside the public route allowlist: {url}")

          sitemap_text = "\n".join(urls) + "\n"
          pathlib.Path("sitemap.txt").write_text(sitemap_text, encoding="utf-8")
          pathlib.Path("status.json").write_text(
              json.dumps(
                  {
                      "generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      "source": INDEX_URL,
                      "sitemapFiles": len(sitemap_urls),
                      "urlCount": len(urls),
                      "sha256": hashlib.sha256(sitemap_text.encode("utf-8")).hexdigest(),
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          print(f"Validated {len(urls)} unique canonical URLs from {len(sitemap_urls)} sitemap files")

      - name: Commit an updated mirror and freshness status
        run: |
          if [ -z "$(git status --porcelain -- sitemap.txt status.json)" ]; then
            echo "The mirror and status are already current."
            exit 0
          fi
          git config user.name "Neopolis Sitemap Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.txt status.json
          git commit -m "Refresh public sitemap"
          git push

      - name: Close an earlier refresh alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --search '"[monitor] Sitemap mirror refresh failed" in:title' --json number --jq '.[].number' |
            xargs -r -n1 gh issue close --comment "The scheduled sitemap refresh is healthy again."

      - name: Open or update a refresh alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number=$(gh issue list --state open --search '"[monitor] Sitemap mirror refresh failed" in:title' --json number --jq '.[0].number // empty')
          body="The sitemap mirror refresh failed at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Review run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title "[monitor] Sitemap mirror refresh failed" --body "$body"
          fi
